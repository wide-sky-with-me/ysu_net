[package]
name = "ysu-net"
version = "0.2.1"
description = "YSU campus network desktop client"
authors = ["ysu-net contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
ysu-auth = { path = "../crates/ysu-auth" }
fs2 = "0.4"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

bzip2 = "0.6"
qbsdiff = "=1.4.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
semver = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
