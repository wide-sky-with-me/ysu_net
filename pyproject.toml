[project]
name = "ysu-net-login"
version = "0.1.0"
description = "燕山大学校园网登录脚本"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "urllib3>=1.26",
    "pycryptodome>=3.18",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
ysu = "ysu_net.manager.cli:main"
ysu-gui = "ysu_net.gui.app:main"

[dependency-groups]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ysu_net"]
