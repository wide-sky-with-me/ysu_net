[project]
name = "ysu-net-login"
version = "0.2.1"
description = "燕山大学校园网登录脚本"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "urllib3>=1.26",
    "pycryptodome>=3.18",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
ysu = "ysu_net.manager.cli:main"

[dependency-groups]
desktop-test = ["playwright>=1.40", "psutil>=7,<8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ysu_net"]
