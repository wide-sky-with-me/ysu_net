{
  "name": "功能建议",
  "description": "描述明确的使用问题、预期行为与适用版本。",
  "title": "[建议] ",
  "labels": ["enhancement"],
  "body": [
    {"type": "markdown", "attributes": {"value": "尚未成形的方案可先到 [Ideas](https://github.com/wide-sky-with-me/ysu_net/discussions/categories/ideas) 讨论。公开示例只使用虚构占位值；不要包含账号、密码、会话、个人或设备识别资料。"}},
    {"type": "input", "id": "version", "attributes": {"label": "目标版本与使用方式", "placeholder": "例如 main 命令行版 / v0.1.0-beta.1 桌面版"}, "validations": {"required": true}},
    {"type": "textarea", "id": "problem", "attributes": {"label": "希望解决的使用问题", "description": "说明现有操作哪里困难、影响哪些场景，不需要个人资料。"}, "validations": {"required": true}},
    {"type": "textarea", "id": "proposal", "attributes": {"label": "期望行为与验收方式", "description": "说明用户操作、预期结果，以及怎样判断改进有效。"}, "validations": {"required": true}},
    {"type": "textarea", "id": "alternatives", "attributes": {"label": "已有替代办法（可选）"}},
    {"type": "checkboxes", "id": "privacy", "attributes": {"label": "提交前确认", "options": [{"label": "我已搜索已有建议；正文和附件仅含脱敏或虚构示例，不含凭据、会话和个人/设备识别信息。", "required": true}]}}
  ]
}
