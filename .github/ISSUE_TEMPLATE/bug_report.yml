{
  "name": "问题反馈",
  "description": "报告可复现的程序故障，提交前检查脱敏。",
  "title": "[问题] ",
  "labels": ["bug"],
  "body": [
    {"type": "markdown", "attributes": {"value": "先搜索已有 Issue；使用问答请到 Discussions / Q&A。公开内容不要包含真实账号、密码、Cookie、Token、会话、IP/MAC、姓名、位置或本机路径。不要上传完整配置、HAR、原始响应或认证截图。请先阅读 [脱敏清单](https://github.com/wide-sky-with-me/ysu_net/blob/main/docs/security.md#公开反馈的脱敏清单)。"}},
    {"type": "input", "id": "version", "attributes": {"label": "工具版本或提交号", "description": "注明下载版本或源码提交；不要填写账号信息。", "placeholder": "例如 v0.1.0-beta.1，或 main 的提交短哈希"}, "validations": {"required": true}},
    {"type": "dropdown", "id": "client", "attributes": {"label": "使用方式", "options": ["Linux 命令行版", "Windows 桌面版", "Ubuntu 桌面版", "其他/不确定"]}, "validations": {"required": true}},
    {"type": "input", "id": "system", "attributes": {"label": "操作系统版本", "placeholder": "例如 Windows 11 x64 / Ubuntu 24.04；不要填写设备名或 IP"}, "validations": {"required": true}},
    {"type": "dropdown", "id": "backend", "attributes": {"label": "认证方式", "options": ["API（默认）", "浏览器", "尚未配置/不确定"]}, "validations": {"required": true}},
    {"type": "dropdown", "id": "service", "attributes": {"label": "网络服务", "options": ["校园网", "中国移动", "中国联通", "中国电信", "不确定"]}, "validations": {"required": true}},
    {"type": "dropdown", "id": "network", "attributes": {"label": "复现时的网络环境", "options": ["已接入校园网", "校外网络", "不确定"]}, "validations": {"required": true}},
    {"type": "textarea", "id": "steps", "attributes": {"label": "最小复现步骤", "description": "描述点击/命令顺序、自动重连是否开启；账号只用占位符。", "placeholder": "1. 打开工具并启用自动重连\n2. 在门户手动下线\n3. 等待重连后观察界面，再手动刷新"}, "validations": {"required": true}},
    {"type": "textarea", "id": "result", "attributes": {"label": "预期与实际结果", "description": "分别说明界面状态、独立状态查询和网络连通性；不要粘贴原始账户数据。"}, "validations": {"required": true}},
    {"type": "textarea", "id": "logs", "attributes": {"label": "最少量的脱敏错误片段（可选）", "description": "仅节选人工检查后的固定状态/错误提示，移除个人路径和识别字段；不要粘贴 --raw、--debug 或完整日志。", "render": "text"}},
    {"type": "checkboxes", "id": "privacy", "attributes": {"label": "提交前确认", "options": [{"label": "我已搜索已有反馈，并检查正文及全部附件，已移除凭据、会话和个人/设备识别信息。", "required": true}]}}
  ]
}
