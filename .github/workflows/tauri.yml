name: Native Rust desktop builds
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    # Path filters are not evaluated for tag pushes, so release tags always build.
    tags: ["v*"]
    paths: ["desktop/**", "src/**", "tests/**", "packaging/*tauri*", "pyproject.toml", "uv.lock", ".github/workflows/tauri.yml"]
  pull_request:
    paths: ["desktop/**", "src/**", "tests/**", "packaging/*tauri*", "pyproject.toml", "uv.lock", ".github/workflows/tauri.yml"]
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bundles: deb
            binary: desktop/src-tauri/target/release/ysu-net
          - os: windows-2022
            name: windows-x64
            bundles: nsis
            binary: desktop/src-tauri/target/release/ysu-net.exe
          - os: macos-15
            name: macos-arm64
            bundles: app,dmg
            binary: desktop/src-tauri/target/release/bundle/macos/YSU Net.app/Contents/MacOS/ysu-net
          - os: macos-15-intel
            name: macos-x64
            bundles: app,dmg
            binary: desktop/src-tauri/target/release/bundle/macos/YSU Net.app/Contents/MacOS/ysu-net
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      CARGO_BUILD_JOBS: "2"
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/crates/ysu-auth
      - name: Linux native SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf xvfb dbus-x11 xauth imagemagick fonts-noto-cjk desktop-file-utils
      - run: npm ci --prefix desktop
      - name: Frontend and native build entry checks
        run: |
          npm --prefix desktop run check
          npm --prefix desktop test
          npm --prefix desktop run test:build
          npm --prefix desktop run build
      - name: Rust authentication and runtime tests
        run: |
          # generate_context! embeds the generated icons, so tests need them first.
          npm --prefix desktop run native:build -- --prepare-only
          cargo fmt --manifest-path desktop/crates/ysu-auth/Cargo.toml --check
          cargo test --locked --manifest-path desktop/crates/ysu-auth/Cargo.toml
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      # The CDP pipe is wired differently per OS (fd 3/4 vs inherited Win32 handles).
      - name: Real Chromium authentication fixtures
        run: |
          case "$RUNNER_OS" in
            Linux) chromium="$(command -v google-chrome)" ;;
            Windows) chromium="C:\Program Files\Google\Chrome\Application\chrome.exe" ;;
            macOS) chromium="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
          esac
          export YSU_AUTH_CHROMIUM_PATH="$chromium"
          cargo test --locked --manifest-path desktop/crates/ysu-auth/Cargo.toml -- --ignored --test-threads=1
      - name: Build native bundles without Python
        run: npm --prefix desktop run native:build -- --bundles '${{ matrix.bundles }}'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: External acceptance tools and retained CLI regressions
        run: |
          uv sync --locked --group desktop-test
          uv run --no-sync python -m unittest discover -s tests -p test_node_runtime.py -v
          uv run --no-sync python -m unittest discover -s tests -p test_system_browser.py -v
      - name: Built frontend browser acceptance
        if: runner.os == 'Linux'
        run: |
          mkdir -p build
          npm --prefix desktop run preview -- --port 1422 --strictPort > build/tauri-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:1422/ > /dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then cat build/tauri-preview.log; exit 1; fi
            sleep 0.25
          done
          uv run --no-sync python packaging/tauri_web_smoke.py --url http://127.0.0.1:1422/ \
            --browser "$(command -v google-chrome)" --output dist/rust-desktop-preview/compatibility
          uv run --no-sync python desktop/tests/rust_desktop_preview.py --url http://127.0.0.1:1422/ \
            --browser "$(command -v google-chrome)"
          uv run --no-sync python desktop/tests/multi_account_preview.py --url http://127.0.0.1:1422/ \
            --browser "$(command -v google-chrome)" --output dist/rust-desktop-preview/multi-account
      - name: Native WebView and lifecycle acceptance
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
              uv run --no-sync python packaging/tauri_smoke.py --binary '${{ matrix.binary }}' \
                --output dist/rust-desktop-smoke --capture-desktop
            dbus-run-session -- xvfb-run -a uv run --no-sync python packaging/tauri_linux_lifecycle.py \
              --binary '${{ matrix.binary }}' --output dist/rust-desktop-smoke
          else
            uv run --no-sync python packaging/tauri_smoke.py --binary '${{ matrix.binary }}' \
              --output dist/rust-desktop-smoke
          fi
      # Install the real package, run the smoke from the installed location, then uninstall.
      - name: Installed package acceptance (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -euo pipefail
          entry="/usr/share/applications/YSU Net.desktop"
          package=(desktop/src-tauri/target/release/bundle/deb/*.deb)
          [ "${#package[@]}" -eq 1 ] || { echo "expected one .deb: ${package[*]}"; exit 1; }
          sudo apt-get install -y "./${package[0]}"
          dpkg-query -W -f='${Status} ${Version}\n' ysu-net | tee /dev/stderr | grep -q '^install ok installed '
          test -x /usr/bin/ysu-net
          desktop-file-validate "$entry"
          grep -qx 'Exec=ysu-net' "$entry"
          grep -qx 'Icon=ysu-net' "$entry"
          for size in 32x32 128x128; do test -f "/usr/share/icons/hicolor/$size/apps/ysu-net.png"; done
          [ "$(command -v ysu-net)" = /usr/bin/ysu-net ]
          ysu-net --help | grep -q -- '--minimized'
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            uv run --no-sync python packaging/tauri_smoke.py --binary /usr/bin/ysu-net \
              --output dist/rust-desktop-installed --capture-desktop
          sudo apt-get remove -y ysu-net
          ! dpkg-query -W -f='${Status}\n' ysu-net 2>/dev/null | grep -q '^install ok installed'
          test ! -e /usr/bin/ysu-net
          test ! -e "$entry"
      - name: Installed package acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one NSIS installer, found $($setup.Count)" }
          $process = Start-Process $setup[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited $($process.ExitCode)" }
          # The installer may start the app; the smoke run needs the single instance to itself.
          Get-Process ysu-net -ErrorAction SilentlyContinue | Stop-Process -Force
          $roots = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $entry = Get-ItemProperty $roots -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'YSU Net'
          if (-not $entry) { throw 'per-user uninstall entry for YSU Net is missing' }
          if ($entry.DisplayVersion -ne '0.1.0') { throw "unexpected DisplayVersion $($entry.DisplayVersion)" }
          $dir = $entry.InstallLocation
          if (-not $dir) { $dir = Split-Path ($entry.UninstallString.Trim('"')) }
          $dir = $dir.Trim('"')
          $exe = Join-Path $dir 'ysu-net.exe'
          if (-not (Test-Path $exe)) { throw "installed executable missing: $exe" }
          if (-not $dir.StartsWith($env:LOCALAPPDATA, [StringComparison]::OrdinalIgnoreCase)) { throw "not a per-user install: $dir" }
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcut = @(Get-ChildItem $programs -Recurse -Filter 'YSU Net.lnk')
          if ($shortcut.Count -lt 1) { throw 'Start menu shortcut is missing' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut[0].FullName).TargetPath
          if ($target -ne $exe) { throw "shortcut points to $target" }
          uv run --no-sync python packaging/tauri_smoke.py --binary $exe --output dist/rust-desktop-installed
          if ($LASTEXITCODE -ne 0) { throw "installed smoke exited $LASTEXITCODE" }
          # _?= keeps the uninstaller in place so -Wait covers the real removal.
          $uninstaller = $entry.UninstallString.Trim('"')
          $process = Start-Process $uninstaller -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "uninstaller exited $($process.ExitCode)" }
          if (Test-Path $exe) { throw 'executable remained after uninstall' }
          if (Get-ItemProperty $roots -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'YSU Net') { throw 'uninstall entry remained' }
          if (@(Get-ChildItem $programs -Recurse -Filter 'YSU Net.lnk').Count) { throw 'Start menu shortcut remained' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            dist/rust-desktop-smoke/
            dist/rust-desktop-preview/
            dist/rust-desktop-installed/
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: rust-desktop-bundle-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Release notes match the tag
        run: |
          grep -qx "## YSU Net $GITHUB_REF_NAME" packaging/release-notes.md || {
            echo "packaging/release-notes.md must start a section '## YSU Net $GITHUB_REF_NAME'"; exit 1; }
      - name: Build Python distributions
        run: uv build
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-desktop-bundle-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          find artifacts -mindepth 2 -type f -exec mv -t artifacts {} +
          find artifacts -mindepth 1 -type d -empty -delete
          cp dist/*.whl dist/*.tar.gz artifacts/
          (cd artifacts && sha256sum * > ../SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v1.0.0-beta.1) are pre-releases for testers, never "Latest".
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "YSU Net $GITHUB_REF_NAME" --notes-file packaging/release-notes.md "${flags[@]}"
