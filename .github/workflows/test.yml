name: Mock tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra browser
      - run: uv run --extra browser python -m unittest discover -s tests -v
      - run: bash -n install.sh uninstall.sh ysu-net-auth-daemon.sh ysu-net-auth-install.sh ysu-net-auth-uninstall.sh
