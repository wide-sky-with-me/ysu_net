name: Mock tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned public delta tools
        uses: ./.github/actions/setup-delta-tools
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra browser
      - name: Require OpenSSL for loopback TLS regressions
        run: openssl version
      - run: uv run --extra browser python -m unittest discover -s tests -v
      - run: bash -n install.sh uninstall.sh
      - run: uv run ysu --help
      - run: uv build
      - name: Verify shared campus address data in wheel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, 'Expected one Python wheel'
          source = Path('src/ysu_net/auth/campus-addresses.json').read_bytes()
          with ZipFile(wheels[0]) as wheel:
              assert wheel.read('ysu_net/auth/campus-addresses.json') == source
          PY
      - name: Retain Python packages for runtime acceptance
        uses: actions/upload-artifact@v4
        with:
          name: ysu-net-python-dev
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
